
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Balu🎂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

        .container {
            text-align: center;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* Gift */
        .gift {
            position: relative;
            width: 150px;
            height: 130px;
            margin: auto;
            cursor: pointer;
            animation: bounce 1.5s infinite;
        }

        .box {
            position: absolute;
            bottom: 0;
            width: 150px;
            height: 100px;
            background: #ff4b5c;
            border-radius: 5px;
        }

        .box::before {
            content: "";
            position: absolute;
            left: 65px;
            width: 20px;
            height: 100px;
            background: #ffd166;
        }

        .lid {
            position: absolute;
            top: 20px;
            left: -10px;
            width: 170px;
            height: 30px;
            background: #ff304f;
            border-radius: 5px;
            transition: 0.7s;
        }

        .lid::before {
            content: "";
            position: absolute;
            left: 75px;
            width: 20px;
            height: 30px;
            background: #ffd166;
        }

        /* Bow */
        .bow {
            position: absolute;
            top: 0;
            left: 58px;
            width: 35px;
            height: 25px;
            background: #ffd166;
            border-radius: 50%;
        }

        /* Birthday message */
        .message {
            display: none;
            margin-top: 30px;
            animation: appear 1s ease;
        }

        .message h2 {
            font-size: 38px;
            margin: 10px;
        }

        .message p {
            font-size: 20px;
            max-width: 500px;
            line-height: 1.6;
            margin: auto;
        }

        .cake {
            font-size: 70px;
            margin: 10px;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -120px;
            font-size: 50px;
            animation: float 8s linear infinite;
        }

        .b1 {
            left: 10%;
            animation-delay: 1s;
        }

        .b2 {
            left: 30%;
            animation-delay: 3s;
        }

        .b3 {
            left: 70%;
            animation-delay: 2s;
        }

        .b4 {
            left: 90%;
            animation-delay: 4s;
        }

        @keyframes float {
            from {
                bottom: -120px;
            }

            to {
                bottom: 110%;
                transform: rotate(20deg);
            }
        }

        @keyframes bounce {
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Floating balloons -->
    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>

    <div class="container">

        <h1>🎉 Hey Balu! 🎉</h1>

        <p class="subtitle">
            I have a little surprise for you...
        </p>

        <!-- Gift -->
        <div class="gift" onclick="openGift()">

            <div class="bow"></div>
            <div class="lid" id="lid"></div>
            <div class="box"></div>

        </div>

        <p>👆 Click the gift!</p>

        <!-- Hidden message -->
        <div class="message" id="message">

            <div class="cake">🎂</div>

            <h2>HAPPY BIRTHDAY Balu! 🥳</h2>
            <a></a>            
            <img src = "balu1.jpeg"
             alt = "hello balu"
             height = "300">
            <img src = "balu2.jpeg"
             alt = "hello balu"
             height = "300">
            <button onclick="startBirthday()">🎉 Click to Enter 🎉</button>

            <audio id="music" loop>
                <source src="music/Yeshanag.mp3" type="audio/mpeg">
            </audio>

            <script>
            function startBirthday() {
                document.getElementById("music").play();
            }
            </script>
            <p>
              happy birthday my dear best friend ❤️
                <br><br>

                May this new year of your life brings you
                lots of joy,success, crazy adventures and
                a good girl friend also 😁 ✨
                <br><br>

                be Happy always! 😎
            </p>

            <h2>🎈🎁🥳🎂🎉</h2>

        </div>

    </div>


    <script>

        function openGift() {

            // Open the lid
            document.getElementById("lid").style.transform =
                "translateY(-80px) rotate(-15deg)";

            // Show message
            document.getElementById("message").style.display =
                "block";

            // Hide click instruction
            document.querySelector(".gift + p").style.display =
                "none";

        }

    </script>

</body>
</html>
